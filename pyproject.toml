[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multilingual-rag-mcp"
version = "0.1.0"
description = "Multilingual RAG MCP server — cross-lingual search over local documents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "rag", "multilingual", "semantic-search", "cross-lingual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "mcp>=2.0,<3.0",
    "chromadb>=1.0",
    "fastembed>=0.4",
    "pymupdf>=1.23",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/aliaksandr-kazarez/multilingual-rag-mcp"
Issues = "https://github.com/aliaksandr-kazarez/multilingual-rag-mcp/issues"

[project.scripts]
rag-mcp = "multilingual_rag_mcp.__main__:main"
